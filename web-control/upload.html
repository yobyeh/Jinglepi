<!DOCTYPE html>
<html>
    <head>
        <title>Jingle Pi Control</title>
        <style>
             /* Layout for the entire page */
            body {
            display: flex;
            flex-direction: column; /* Stack header and main sections vertically */
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh; /* Full viewport height */
            }

             /* Header section */
            .header {
            width: 100%; /* Ensure the header spans the full width */
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            box-sizing: border-box;
            }

            .main {
            display: flex;
            flex: 1; /* Take up remaining space below the header */
            flex-direction: row; /* Arrange columns side by side */
            }

            /* Left section: Buttons and settings */
            .left-panel {
            flex: 1; /* Takes available space on the left */
            padding: 20px;
            background-image: url('/web-control/assets/circuit-bg.jpg'); /* Path to the image */
            background-size: cover; /* Ensure the image covers the entire window */
            background-repeat: no-repeat; /* Prevent tiling */
            background-attachment: fixed; /* Make the background stay fixed during scrolling */
            background-position: center; /* Center the background image */
            border-right: 2px solid #ddd;
            }

            .left-panel h1 {
            margin-bottom: 20px;
            }

            .left-panel button {
            display: block;
            margin-bottom: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color :#444444;
            cursor: pointer;
            }

            .left-panel input[type="color"] {
            margin-top: 20px;
            display: block;
            width: 100px;
            height: 40px;
            cursor: pointer;
            }

            progress {
                height: 20px;
                border-radius: 5px;
            }
        </style>
    </head>
    <body>

        <!-- Header section -->
        <div class="header">
            Jingle Pi Control
        </div>

        <header>
            <nav>
                <a href="index.html">Simulation</a>
                <a href="settings.html">Settings</a>
                <a href="program.html">Programs</a>
                <a href="upload.html">Upload</a>
            </nav>
        </header>

        <!-- Main content -->
        <div class="main">
            <!-- Add inside your body -->
            <div class="left-panel">
                <h2>Upload File</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <label>Select File:</label>
                    <input type="file" id="fileInput" required>
                    <label>Rename (optional) dont forget .filetype:</label>
                    <input type="text" id="newFileName" placeholder="e.g. pattern1.json">
                    <button type="submit">Upload</button>
                    <!-- ✅ Progress feedback -->
                    <progress id="uploadProgress" value="0" max="100" style="width: 100%; display: none;"></progress>
                    <p id="progressLabel"></p>
                </form>
                <p id="uploadStatus"></p>
            </div>

            <!-- Right panel for the grid -->
            <div class="right-panel">
                <h2>Uploaded Files</h2>
                <div id="fileList"></div>
            </div>
        </div>


        <script>
            let ws;
            let reconnectAttempts = 0;
            const maxReconnects = 5; // Limit reconnect attempts

            function connectWebSocket() {
                if (reconnectAttempts >= maxReconnects) {
                    console.error("WebSocket failed to reconnect after multiple attempts.");
                    return;
                }

                const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
                const wsHost = window.location.hostname + ":8000";  // Auto-detect host
                ws = new WebSocket(wsProtocol + wsHost + "/ws");

                ws.onopen = () => {
                    console.log("WebSocket connection established");
                };

                // ✅ Handle WebSocket Messages for Grid Updates
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log("📩 Received data:", data);

                        // ✅ Check if the received data contains a valid matrix
                        if (data.matrix) {
                            console.log("✅ Matrix received, updating grid...");
                            updateGrid(data.matrix);
                        } else {
                            console.log("ℹ️ Received a message from the server:", data.message);
                        }
                    } catch (error) {
                        console.error("❌ Error processing WebSocket message:", error.message);
                    }
                };

                ws.onclose = () => {
                    console.warn("WebSocket disconnected. Retrying in 3 seconds...");
                    reconnectAttempts++;
                    setTimeout(connectWebSocket, 3000);  // Reconnect after 3 seconds
                };

                ws.onerror = (error) => {
                    console.error("WebSocket error:", error);
                    reconnectAttempts++;
                    setTimeout(connectWebSocket, 3000);
                };
            };

            connectWebSocket();
            
            // ✅ Safe Message Sending (Only Retries for a Limited Time)
            function sendMessage(message, retries = 5) {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(message));
                } else if (retries > 0) {
                    console.warn("WebSocket not ready. Retrying in 500ms...");
                    setTimeout(() => sendMessage(message, retries - 1), 500);
                } else {
                    console.error("Failed to send message: WebSocket is not connected.");
                }
            }

            // ✅ File upload with rename
            document.getElementById("uploadForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const fileInput = document.getElementById("fileInput");
                const newFileName = document.getElementById("newFileName").value.trim();
                const status = document.getElementById("uploadStatus");
                const progressBar = document.getElementById("uploadProgress");
                const progressLabel = document.getElementById("progressLabel");

                if (fileInput.files.length === 0) {
                    status.textContent = "❌ No file selected.";
                    return;
                }

                const file = fileInput.files[0];
                const renamedFile = new File([file], newFileName || file.name, { type: file.type });

                const allowedExtensions = [".json", ".txt", ".csv"];
                const fileName = renamedFile.name.toLowerCase();
                //if (!allowedExtensions.some(ext => fileName.endsWith(ext))) {
                    //status.textContent = "❌ Invalid file type. Only .json, .txt, or .csv allowed.";
                    //return;
                //}

                const formData = new FormData();
                formData.append("file", renamedFile);

                // ✅ Use XMLHttpRequest for upload progress
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener("progress", (event) => {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        progressBar.style.display = "block";
                        progressBar.value = percent;
                        progressLabel.textContent = `Uploading: ${percent}%`;
                    }
                });

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        const result = JSON.parse(xhr.responseText);
                        status.textContent = "✅ " + result.message;
                        progressLabel.textContent = "✅ Upload complete!";
                        sendMessage({ event: "fileUploaded", filename: renamedFile.name });
                    } else {
                        status.textContent = "❌ Upload failed.";
                        progressLabel.textContent = "";
                    }
                };

                xhr.onerror = () => {
                    status.textContent = "❌ Upload error.";
                    progressLabel.textContent = "";
                };

                xhr.open("POST", "/upload");
                xhr.send(formData);
            });

        
            // ✅ Handle Button Clicks
            document.addEventListener("click", (event) => {
                let button = event.target;
                if (button.tagName === "BUTTON") {
                    let buttonId = button.id;
                    console.log("Button clicked:", buttonId);
                    sendMessage({ button: buttonId });
                }
            });

            async function loadUploadedFiles() {
                const response = await fetch("/list_uploads");
                const files = await response.json();
                
                const fileListDiv = document.getElementById("fileList");
                fileListDiv.innerHTML = "";

                files.forEach(filename => {
                    const fileEntry = document.createElement("div");
                    fileEntry.innerHTML = `
                        <strong>${filename}</strong>
                        <input type="text" placeholder="e.g. 16x16" id="grid_${filename}">
                        <button onclick="convertFile('${filename}')">Convert</button>
                        <span id="status_${filename}"></span>
                    `;
                    fileListDiv.appendChild(fileEntry);
                });
            }

            async function convertFile(filename) {
                const sizeInput = document.getElementById(`grid_${filename}`).value.trim();
                const statusSpan = document.getElementById(`status_${filename}`);
                
                if (!sizeInput.match(/^\d+x\d+$/)) {
                    statusSpan.textContent = "❌ Invalid size (use format 16x16)";
                    return;
                }

                statusSpan.textContent = "⏳ Converting...";

                const response = await fetch("/convert_file", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ filename, grid_size: sizeInput })
                });

                const result = await response.json();
                statusSpan.textContent = result.message;
            }

            // Load file list on page load
            loadUploadedFiles();


        </script>
    </body>
</html>
